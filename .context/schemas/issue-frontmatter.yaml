# Schema: Issue File Frontmatter
#
# Validates the YAML frontmatter of issue files in .context/issues/.
# Encodes the v2 issue-file format defined by the dotclaude standard
# (templates/ISSUE.md; canonical spec tracked in the dotclaude issue
# issue-format-specification).
#
# Usage:
#   tiredize --frontmatter-schema .context/schemas/issue-frontmatter.yaml .context/issues/*.md

allow_extra_fields: false

fields:
  status:
    type: string
    allowed:
      - draft
      - ready
      - in-progress
      - in-review
      - done
      - blocked
      - cancelled

  type:
    type: string
    allowed:
      - bug
      - feature
      - refactor
      - spike
      - documentation

  priority:
    type: string
    allowed:
      - critical
      - high
      - medium
      - low

  created:
    type: date

  workflow:
    type: string
    allowed:
      - software-engineering
      - documentation
      - to-be-determined

  tags:
    type: list

  knowledge:
    type: list

  assignee:
    type: string
    required: false
    allowed:
      - PM
      - qa-engineer
      - software-engineer
      - technical-architect
      - ghostwriter
      - proofreader
      - workflow-owner
      - user

  step:
    type: string
    required: false
