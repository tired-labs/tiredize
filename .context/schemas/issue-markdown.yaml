# Schema: Issue File
#
# Validates the section structure of issue files in .context/issues/.
# Encodes the v2 issue-file format defined by the dotclaude standard
# (templates/ISSUE.md; canonical spec tracked in the dotclaude issue
# issue-format-specification).
#
# Usage:
#   tiredize --markdown-schema .context/schemas/issue-markdown.yaml .context/issues/*.md
#
# Note: This schema validates section structure only. Frontmatter
# validation is handled by issue-frontmatter.yaml.
#
# Every ## section may contain optional free-form ### (and ####)
# subsections; the Comments section uses ### entries for its log.

enforce_order: true
allow_extra_sections: false

sections:
  - pattern: ".+"
    level: 1
    sections:
      - name: "Summary"
        level: 2
        sections:
          - pattern: ".+"
            level: 3
            required: false
            repeat:
              min: 0
            sections:
              - pattern: ".+"
                level: 4
                required: false
                repeat:
                  min: 0

      - name: "Acceptance Criteria"
        level: 2
        sections:
          - pattern: ".+"
            level: 3
            required: false
            repeat:
              min: 0
            sections:
              - pattern: ".+"
                level: 4
                required: false
                repeat:
                  min: 0

      - name: "Design Decisions"
        level: 2
        sections:
          - pattern: ".+"
            level: 3
            required: false
            repeat:
              min: 0
            sections:
              - pattern: ".+"
                level: 4
                required: false
                repeat:
                  min: 0

      - name: "Open Questions"
        level: 2
        sections:
          - pattern: ".+"
            level: 3
            required: false
            repeat:
              min: 0
            sections:
              - pattern: ".+"
                level: 4
                required: false
                repeat:
                  min: 0

      - name: "Comments"
        level: 2
        sections:
          - pattern: ".+"
            level: 3
            required: false
            repeat:
              min: 0
            sections:
              - pattern: ".+"
                level: 4
                required: false
                repeat:
                  min: 0
