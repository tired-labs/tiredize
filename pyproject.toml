[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
authors = [
  { name = "TIRED Labs" }
]
description = "Configurable schema/linter validation for markdown docs"
# The version is not written here: hatch-vcs derives it from git tags
# (see [tool.hatch.version] below).
dynamic = ["version"]
license = { file = "LICENSE" }
name = "tiredize"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.32.5",
]

# Tools for working on tiredize, not for using it. PEP 735 dependency
# groups are not published in the package metadata. These lists are
# the one place a tool is added or its minimum changed; `uv.lock` is
# generated from them (`uv lock`) and never edited by hand. Minimums
# only: the lock pins the exact versions CI and releases install.
#
# `uv sync` installs `dev`, so a local environment matches CI. `dev`
# includes `release` because installing tiredize in editable mode runs
# the build backend (hatchling, hatch-vcs), which CI installs from the
# lock instead of letting the build fetch it unlocked.
[dependency-groups]
dev = [
  "flake8>=7.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  { include-group = "release" },
]
release = [
  "build>=1.2",
  "hatch-vcs>=0.4",
  "hatchling>=1.25",
]
# Installed only by the CI job that uploads coverage to Coveralls.
coverage = [
  "coveralls>=4.0",
]

[project.urls]
homepage = "https://www.tired-labs.org/"
repository = "https://github.com/tired-labs/tiredize"


# A commit tagged vX.Y.Z builds as X.Y.Z; any other commit builds as a
# dev version that sorts after the last tag. "no-local-version" drops
# the "+g<hash>" local segment, which PyPI and TestPyPI reject. There
# is deliberately no fallback-version: a build without git history
# fails instead of publishing a made-up number.
[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }

[tool.hatch.build.targets.wheel]
packages = ["tiredize"]

[project.scripts]
tiredize = "tiredize.cli:main"

# Resolve only releases at least 14 days old, the same cooldown
# Dependabot uses, so a newly published (or hijacked) release is not
# locked before it has had time to be noticed.
[tool.uv]
exclude-newer = "14 days"
