name: Run tests and upload coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      # Every package comes from uv.lock, hash-checked. uv 0.13.5 is
      # fixed here and the Action checks the download against its own
      # built-in checksum list (no `checksum` input, never skipped).
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false

      # Two steps so tiredize's build tools (hatchling, hatch-vcs, in
      # the `release` group that `dev` includes) are installed from the
      # lock before tiredize itself is built, without build isolation,
      # which would fetch them unlocked.
      - name: Install the locked tools
        run: uv sync --locked --group coverage --no-install-project

      - name: Install tiredize
        run: uv sync --locked --group coverage --no-build-isolation

      - name: Lint with flake8
        run: |
          uv run --locked --no-build-isolation flake8 tiredize tests

      - name: Run tests
        run: |
          uv run --locked --no-build-isolation pytest --cov=tiredize --cov-report=xml

      # coveralls comes from the lock (the `coverage` group), not the
      # Coveralls Action, which downloads an unlocked reporter. As
      # before, a failed upload does not fail the job.
      - name: Upload coverage to Coveralls
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --locked --no-build-isolation --group=coverage coveralls --service=github
